name: Build Saman Hehia Farm APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Folder (www)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'www'

      - name: Deploy Live Auto-Update
        id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    needs: deploy-live
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Wire Auto-Update Live URL into APK
        env:
          LIVE_URL: ${{ needs.deploy-live.outputs.page_url }}
        run: |
          if [ -n "$LIVE_URL" ]; then
            echo "✅ Auto-Update Enabled: $LIVE_URL"
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
              cfg.server = cfg.server || {};
              cfg.server.url = process.env.LIVE_URL;
              cfg.server.allowNavigation = Array.from(new Set([...(cfg.server.allowNavigation || []), '*.github.io']));
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            "
          else
            echo "ℹ️ Building offline-bundled APK (enable GitHub Pages in Settings -> Pages -> GitHub Actions for auto-updates)"
          fi

      - name: Install Dependencies
        run: npm install

      - name: Add & Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saman-Hehia-Farm-ERP-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
