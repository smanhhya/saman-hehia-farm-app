          KEYSTORE_EOF

          node -e '
            const fs = require("fs");
            const p = "android/app/build.gradle";
            let g = fs.readFileSync(p, "utf8");
            const n = parseInt(process.env.BUILD_NUM || "1", 10);
            const vCode = 100 + n;
            const vName = "2.2." + n;
            g = g.replace(/versionCode\s+\d+/, "versionCode " + vCode);
            g = g.replace(/versionName\s+"[^"]+"/, "versionName \"" + vName + "\"");
            const signBlock = [
              "    signingConfigs {",
              "        debug {",
              "            storeFile file(\"saman-fixed.keystore\")",
              "            storePassword \"android\"",
              "            keyAlias \"androiddebugkey\"",
              "            keyPassword \"android\"",
              "        }",
              "    }",
              "    buildTypes {",
              "        debug {",
              "            signingConfig signingConfigs.debug",
              "        }"
            ].join("\n");
            g = g.replace("    buildTypes {", signBlock);
            fs.writeFileSync(p, g, "utf8");
          '

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../saman-hehia-erp.apk

      - name: Publish Latest Release APK (For In-App Update Button)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_NUM: ${{ github.run_number }}
        run: |
          TAG="v2.2.${BUILD_NUM}"
          gh release create "$TAG" saman-hehia-erp.apk --title "سمان ههيا ERP ${TAG}" --notes "تحديث تلقائي بتوقيع ثابت (يتثبت فوق النسخة السابقة بدون مسح)" --latest

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saman-Hehia-Farm-ERP-APK
          path: saman-hehia-erp.apk
          retention-days: 30
