name: Build Saman Hehia Farm APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp Version Info
        run: |
          BUILD_NUM="${{ github.run_number }}"
          REPO="${{ github.repository }}"
          echo "{\"version\":\"2.2.${BUILD_NUM}\",\"build\":${BUILD_NUM},\"repo\":\"${REPO}\",\"apkUrl\":\"https://github.com/${REPO}/releases/latest/download/saman-hehia-erp.apk\",\"updatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > www/version.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload www
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'www'

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    needs: deploy-live
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Stamp Version Info in APK
        run: |
          BUILD_NUM="${{ github.run_number }}"
          REPO="${{ github.repository }}"
          echo "{\"version\":\"2.2.${BUILD_NUM}\",\"build\":${BUILD_NUM},\"repo\":\"${REPO}\",\"apkUrl\":\"https://github.com/${REPO}/releases/latest/download/saman-hehia-erp.apk\",\"updatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > www/version.json

      - name: Wire Auto-Update URL
        env:
          LIVE_URL: ${{ needs.deploy-live.outputs.page_url }}
        run: |
          if [ -n "$LIVE_URL" ]; then
            node -e 'const fs=require("fs"),c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));c.server=c.server||{};c.server.url=process.env.LIVE_URL;c.server.allowNavigation=[...new Set([...(c.server.allowNavigation||[]),"*.github.io","github.com","api.github.com"])];fs.writeFileSync("capacitor.config.json",JSON.stringify(c,null,2));'
          fi

      - name: Install Dependencies & Sync Android
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Lock Fixed Keystore & Increment VersionCode
        env:
          BUILD_NUM: ${{ github.run_number }}
          KS_B64: ""
        run: |
          printf "%s" "$KS_B64" | base64 -d > android/app/saman-fixed.keystore
          keytool -list -keystore android/app/saman-fixed.keystore -storepass android

          node -e '
            const fs = require("fs");
            const p = "android/app/build.gradle";
            let g = fs.readFileSync(p, "utf8");
            const n = parseInt(process.env.BUILD_NUM || "1", 10);
            const vCode = 100 + n;
            const vName = "2.2." + n;
            g = g.replace(/versionCode\s+\d+/, "versionCode " + vCode);
            g = g.replace(/versionName\s+"[^"]+"/, "versionName \"" + vName + "\"");
            if (!g.includes("saman-fixed.keystore")) {
              const signBlock = [
                "    signingConfigs {",
                "        debug {",
                "            storeFile file(\"saman-fixed.keystore\")",
                "            storePassword \"android\"",
                "            keyAlias \"androiddebugkey\"",
                "            keyPassword \"android\"",
                "        }",
                "    }",
                "    buildTypes {",
                "        debug {",
                "            signingConfig signingConfigs.debug",
                "        }"
              ].join("\n");
              g = g.replace(/^\s*buildTypes\s*\{/m, signBlock);
            }
            fs.writeFileSync(p, g, "utf8");
            console.log("=== PATCHED build.gradle ===\n" + g);
          '

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../saman-hehia-erp.apk

      - name: Publish Latest Release APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_NUM: ${{ github.run_number }}
        run: |
          TAG="v2.2.${BUILD_NUM}"
          gh release create "$TAG" saman-hehia-erp.apk --title "سمان ههيا ERP ${TAG}" --notes "تحديث تلقائي بتوقيع ثابت" --latest

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saman-Hehia-Farm-ERP-APK
          path: saman-hehia-erp.apk
          retention-days: 30
