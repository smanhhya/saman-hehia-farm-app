name: Build Saman Hehia Farm APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp Version Info
        run: |
          BUILD_NUM="${{ github.run_number }}"
          REPO="${{ github.repository }}"
          echo "{\"version\":\"2.2.${BUILD_NUM}\",\"build\":${BUILD_NUM},\"repo\":\"${REPO}\",\"apkUrl\":\"https://github.com/${REPO}/releases/latest/download/saman-hehia-erp.apk\",\"updatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > www/version.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload www
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'www'

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    needs: deploy-live
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Stamp Version Info in APK
        run: |
          BUILD_NUM="${{ github.run_number }}"
          REPO="${{ github.repository }}"
          echo "{\"version\":\"2.2.${BUILD_NUM}\",\"build\":${BUILD_NUM},\"repo\":\"${REPO}\",\"apkUrl\":\"https://github.com/${REPO}/releases/latest/download/saman-hehia-erp.apk\",\"updatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > www/version.json

      - name: Wire Auto-Update URL
        env:
          LIVE_URL: ${{ needs.deploy-live.outputs.page_url }}
        run: |
          if [ -n "$LIVE_URL" ]; then
            node -e 'const fs=require("fs"),c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));c.server=c.server||{};c.server.url=process.env.LIVE_URL;c.server.allowNavigation=[...new Set([...(c.server.allowNavigation||[]),"*.github.io","github.com","api.github.com"])];fs.writeFileSync("capacitor.config.json",JSON.stringify(c,null,2));'
          fi

      - name: Install Dependencies & Sync Android
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

